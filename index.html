<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Trusted Partners | Pharmac-Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3a7bd5;
            --primary-dark: #2a5da8;
            --secondary: #00d2ff;
            --accent: #e6e9ed;
            --text: #2d3436;
            --light-text: #636e72;
            --white: #ffffff;
            --light-bg: #f5f7fa;
            --gold: #fdcb6e;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .onboarding-container {
            max-width: 100%;
            padding: 1rem;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .header {
            margin-bottom: 1.5rem;
            width: 100%;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
            position: relative;
            display: inline-block;
        }

        .title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--light-text);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .partners-container {
            width: 100%;
            max-width: 800px;
            margin: 1rem auto;
            position: relative;
            overflow: hidden;
            height: auto;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            padding: 0.5rem;
            width: 100%;
        }

        .partner-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 1.2rem 0.8rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
            min-height: 80px;
        }

        .partner-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-dark);
            position: relative;
        }

        .partner-name::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 2px;
            background: var(--gold);
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.6rem;
            }
            
            .title {
                font-size: 1.3rem;
            }
            
            .subtitle {
                font-size: 0.85rem;
                padding: 0 1rem;
            }
            
            .partners-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 0.8rem;
            }
            
            .partner-card {
                padding: 1rem 0.5rem;
                min-height: 70px;
            }
            
            .partner-name {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.5rem;
            }
            
            .title {
                font-size: 1.2rem;
            }
            
            .subtitle {
                font-size: 0.8rem;
            }
            
            .partners-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="onboarding-container">
        <div class="header">
            <div class="logo">Pharmac-Online</div>
            <h1 class="title">Our Trusted Pharmacy Partners</h1>
            <p class="subtitle">Collaborating with reputable pharmacies to ensure quality medications</p>
        </div>
        
        <div class="partners-container">
            <div class="partners-grid">
                <div class="partner-card">
                    <div class="partner-name">MediCare Prime</div>
                </div>
                <div class="partner-card">
                    <div class="partner-name">Wellness Pharma</div>
                </div>
                <div class="partner-name">Vitality Rx</div>
                </div>
                <div class="partner-card">
                    <div class="partner-name">PureLife Pharmacies</div>
                </div>
                <div class="partner-card">
                    <div class="partner-name">HealthPlus Solutions</div>
                </div>
                <div class="partner-card">
                    <div class="partner-name">CareFirst Pharmacy</div>
                </div>
                <div class="partner-card">
                    <div class="partner-name">Elite Meds</div>
                </div>
                <div class="partner-card">
                    <div class="partner-name">Prime Wellness</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
